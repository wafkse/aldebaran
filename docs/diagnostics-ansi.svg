<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536">
<rect width="100%" height="100%" fill="#0f1419"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="15" xml:space="preserve">
<text x="10" y="18" fill="#d8dee9"><tspan fill="#ff6b6b" font-weight="400">error</tspan><tspan fill="#d8dee9" font-weight="400">: </tspan><tspan fill="#f8fafc" font-weight="400">duplicate binding</tspan></text>
<text x="10" y="41" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    ┌─[&lt;unknown&gt;:1</tspan><tspan fill="#d8dee9" font-weight="400">:3</tspan><tspan fill="#d8dee9" font-weight="400">]</tspan></text>
<text x="10" y="64" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400"> 1</tspan><tspan fill="#d8dee9" font-weight="400">  │ let résumé = &quot;draft&quot;;</tspan></text>
<text x="10" y="87" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │     </tspan><tspan fill="#67e8f9" font-weight="400">^^^^^^</tspan></text>
<text x="10" y="110" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │   </tspan><tspan fill="#d8dee9" font-weight="700">[</tspan><tspan fill="#67e8f9" font-weight="400">^</tspan><tspan fill="#d8dee9" font-weight="700">]</tspan><tspan fill="#d8dee9" font-weight="400">: the first declaration is here</tspan></text>
<text x="10" y="133" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan></text>
<text x="10" y="156" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400"> 2</tspan><tspan fill="#d8dee9" font-weight="400">  │ let résumé = résumé + &quot; final&quot;;</tspan></text>
<text x="10" y="179" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │     </tspan><tspan fill="#d291ff" font-weight="400">******</tspan><tspan fill="#d8dee9" font-weight="400">   </tspan><tspan fill="#61afef" font-weight="400">######</tspan></text>
<text x="10" y="202" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │              </tspan><tspan fill="#7aa2f7" font-weight="400">~~~~~~~~~~~~~~~~~</tspan></text>
<text x="10" y="225" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan><tspan fill="#ffd166" font-weight="400">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan></text>
<text x="10" y="248" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │   </tspan><tspan fill="#d8dee9" font-weight="700">[</tspan><tspan fill="#d291ff" font-weight="400">*</tspan><tspan fill="#d8dee9" font-weight="700">]</tspan><tspan fill="#d8dee9" font-weight="400">: `résumé` is declared again here</tspan></text>
<text x="10" y="271" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan></text>
<text x="10" y="294" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │   </tspan><tspan fill="#d8dee9" font-weight="700">[</tspan><tspan fill="#61afef" font-weight="400">#</tspan><tspan fill="#d8dee9" font-weight="700">]</tspan><tspan fill="#d8dee9" font-weight="400">: this read refers to the binding being shadowed</tspan></text>
<text x="10" y="317" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan></text>
<text x="10" y="340" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │   </tspan><tspan fill="#d8dee9" font-weight="700">[</tspan><tspan fill="#7aa2f7" font-weight="400">~</tspan><tspan fill="#d8dee9" font-weight="700">]</tspan><tspan fill="#d8dee9" font-weight="400">: this initializer belongs to the redeclaration</tspan></text>
<text x="10" y="363" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan></text>
<text x="10" y="386" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │   </tspan><tspan fill="#d8dee9" font-weight="700">[</tspan><tspan fill="#ffd166" font-weight="400">@</tspan><tspan fill="#d8dee9" font-weight="700">]</tspan><tspan fill="#d8dee9" font-weight="400">: the redeclaration spans this statement</tspan></text>
<text x="10" y="409" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan></text>
<text x="10" y="432" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400"> 3</tspan><tspan fill="#d8dee9" font-weight="400">  │ emit(résumé);</tspan></text>
<text x="10" y="455" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │      </tspan><tspan fill="#f8fafc" font-weight="400">------</tspan></text>
<text x="10" y="478" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │   </tspan><tspan fill="#d8dee9" font-weight="700">[</tspan><tspan fill="#f8fafc" font-weight="400">-</tspan><tspan fill="#d8dee9" font-weight="700">]</tspan><tspan fill="#d8dee9" font-weight="400">: this later use would resolve through the redeclaration</tspan></text>
<text x="10" y="501" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">    │ </tspan></text>
<text x="10" y="524" fill="#d8dee9"><tspan fill="#d8dee9" font-weight="400">────┘</tspan></text>
</g>
</svg>
