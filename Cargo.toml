[workspace]
members = [
    "examples/foundations",
    "examples/lexing",
    "examples/diagnostics",
    "examples/presentation",
    "examples/mini-lisp",
    "aldebaran",
    "aldebaran-logic",
    "aldebaran-logic/aldebaran-logic-macro",
    "aldebaran-dsa",
    "aldebaran-heap",
    "aldebaran-id",
    "aldebaran-text",
    "aldebaran-primitive",
    "aldebaran-primitive/aldebaran-primitive-core",
    "aldebaran-primitive/aldebaran-primitive-macro",
    "aldebaran-hash",
    "aldebaran-print",
    "aldebaran-report",
    "aldebaran-report/aldebaran-report-codegen",
    "aldebaran-report/aldebaran-report-macro",
    "aldebaran-ansi",
    "aldebaran-style",
    "aldebaran-grammar",
    "aldebaran-ice",
    "aldebaran-span",
    "aldebaran-source",
    "aldebaran-visualize",
    "aldebaran-interner",

]
resolver = "3"

[workspace.package]
license = "AGPL-3.0-or-later"
repository = "https://github.com/wafkse/aldebaran"
homepage = "https://github.com/wafkse/aldebaran"

[workspace.dependencies]
ahash = { version = "0.8.12", default-features = false }
allocator-api2 = { version = "0.4.0", default-features = false, features = ["alloc"] }
aldebaran = { version = "0.1.0", path = "aldebaran" }
aldebaran-ansi = { version = "0.1.0", path = "aldebaran-ansi" }
aldebaran-dsa = { version = "0.1.0", path = "aldebaran-dsa" }
aldebaran-grammar = { version = "0.1.0", path = "aldebaran-grammar" }
aldebaran-hash = { version = "0.1.0", path = "aldebaran-hash" }
aldebaran-heap = { version = "0.1.0", path = "aldebaran-heap" }
aldebaran-ice = { version = "0.1.0", path = "aldebaran-ice" }
aldebaran-id = { version = "0.1.0", path = "aldebaran-id" }
aldebaran-interner = { version = "0.1.0", path = "aldebaran-interner" }
aldebaran-logic = { version = "0.1.0", path = "aldebaran-logic" }
aldebaran-logic-macro = { version = "0.1.0", path = "aldebaran-logic/aldebaran-logic-macro" }
aldebaran-primitive = { version = "0.1.0", path = "aldebaran-primitive" }
aldebaran-primitive-core = { version = "0.1.0", path = "aldebaran-primitive/aldebaran-primitive-core" }
aldebaran-primitive-macro = { version = "0.1.0", path = "aldebaran-primitive/aldebaran-primitive-macro" }
aldebaran-print = { version = "0.1.0", path = "aldebaran-print" }
aldebaran-report = { version = "0.1.0", path = "aldebaran-report" }
aldebaran-report-codegen = { version = "0.1.0", path = "aldebaran-report/aldebaran-report-codegen" }
aldebaran-report-macro = { version = "0.1.0", path = "aldebaran-report/aldebaran-report-macro" }
aldebaran-source = { version = "0.1.0", path = "aldebaran-source" }
aldebaran-span = { version = "0.1.0", path = "aldebaran-span" }
aldebaran-style = { version = "0.1.0", path = "aldebaran-style" }
aldebaran-text = { version = "0.1.0", path = "aldebaran-text" }
aldebaran-visualize = { version = "0.1.0", path = "aldebaran-visualize" }
const-random = "0.1.18"
fack-codegen = "0.4.0"
fnv = { version = "1.0.7", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }
hashbrown = "0.17.1"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
smallvec = "1.16.1"
syn = { version = "3.0.6", features = ["extra-traits"] }
tokel = "0.3.0"

[profile.dev]
opt-level = 1
