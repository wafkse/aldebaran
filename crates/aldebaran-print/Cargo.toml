[package]
name = "aldebaran-print"
version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Sink-oriented no_std printing with optional external context"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aldebaran-print"
edition = "2024"

[features]
default = []
alloc = ["dep:unicode-segmentation", "dep:unicode-width"]

[dependencies]
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[lints]
workspace = true
