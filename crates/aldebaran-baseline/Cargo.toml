[package]
name = "aldebaran-baseline"
version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Foundational source coordinates and reusable type-level utilities"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aldebaran-baseline"
edition = "2024"

[features]
default = ["alloc"]
alloc = []
allocator = ["alloc", "dep:allocator-api2"]

[dependencies]
aldebaran-print.workspace = true
allocator-api2 = { workspace = true, optional = true }
tokel.workspace = true

[lints]
workspace = true
